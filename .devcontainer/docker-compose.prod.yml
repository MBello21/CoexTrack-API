services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile.prod
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - ../.env
    depends_on:
      - db
    command: uvicorn app.main:app --host 0.0.0.0 --port 3001

  db:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    env_file:
      - ../.env
    ports:
      - "5433:5432"

volumes:
  postgres-data:
